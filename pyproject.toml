[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matterhorn-pomodoro"
version = "1.0.0"
description = "A Pomodoro timer for the terminal: climb the Matterhorn, one focus session at a time."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["pomodoro", "timer", "terminal", "tui", "curses", "productivity"]
classifiers = [
  "Environment :: Console :: Curses",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.scripts]
matterhorn-pomodoro = "matterhorn_pomodoro:main"

[tool.setuptools]
py-modules = ["matterhorn_pomodoro"]
